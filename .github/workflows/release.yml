name: Build installers

# - Every push builds the Windows installer and uploads it as a workflow artifact.
# - Pushing a tag like v0.1.0 (or running the workflow manually) builds Windows, macOS and
#   Linux installers and attaches them to a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the installers'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && '["windows-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    env:
      # Unsigned builds (no code-signing certificates configured).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build the app
        run: |
          npm run typecheck
          npm test --if-present
          npx vite build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: perseverance-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: Perseverance ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-installers/*
