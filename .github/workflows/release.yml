name: Build installers

# - Every push builds the Windows installer and uploads it as a workflow artifact.
# - Pushing a tag like v0.1.0 (or running the workflow manually) builds Windows, macOS and
#   Linux installers and attaches them to a GitHub Release. The Windows installer is required;
#   if the macOS or Linux build fails, the Release still goes out with the installers that built
#   (the failed job stays red in the run). Run the workflow manually without "Create a GitHub
#   Release" first to check all three builds.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the installers'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && '["windows-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    env:
      # Unsigned builds (no code-signing certificates configured).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Keep tool caches OUTSIDE the project: package.json has "type": "module", which would make
      # electron-builder's extracted helper scripts (CommonJS .js) fail to run inside the repo.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../eb-cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/../eb-cache/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../eb-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build the app
        run: |
          npm run typecheck
          npm test --if-present
          npx vite build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --publish never

      # The build is unsigned, so electron-builder skips code signing. Flipping the fuses rewrites a
      # page of "Electron Framework", and an arm64 Mac refuses to launch an app whose ad-hoc signature
      # no longer matches; build.electronFuses.resetAdHocDarwinSignature re-signs the bundle ad hoc.
      # Fail here rather than publish a .dmg that cannot launch (the release job then goes out
      # without it). release/mac = x64, release/mac-arm64 = arm64.
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          set -e
          found=0
          for a in release/mac*/Perseverance.app; do
            [ -d "$a" ] || continue
            found=1
            codesign --verify --deep --strict --verbose=2 "$a"
          done
          if [ "$found" = 0 ]; then echo "::error::No Perseverance.app found under release/mac*"; exit 1; fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: perseverance-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    # !cancelled(): still publish when only the macOS or Linux build failed (checked below).
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - name: Check the installers
        shell: bash
        run: |
          ls -la dist-installers || true
          if ! ls dist-installers/*Setup*.exe >/dev/null 2>&1; then
            echo "::error::The Windows build failed, so no Release is published."
            exit 1
          fi
          for ext in dmg AppImage; do
            if ! ls dist-installers/*.$ext >/dev/null 2>&1; then
              echo "::warning::No .$ext installer (that build failed) - the Release goes out without it."
            fi
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: Perseverance ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-installers/*
